<style>
:root{
  color-scheme:light;
  --page:#F3F1EC;--sheet:#FFFFFF;--ink:#1D2321;--soft:#5C6663;--line:#DDE1DF;
  --bar:#0F3D33;--page2:#FFFFFF;--on-bar:#FFFFFF;--accent:#12634D;--on-accent:#FFFFFF;--selected:#E5F0EC;--mark:#FBE88A;--mark-ink:#1D2321;--danger:#B3213A;--head:#EEF0EF;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#131716;--sheet:#1C2120;--ink:#EDF0EF;--soft:#AAB4B0;--line:#343B39;
    --bar:#0B2A24;--page2:#1C2120;--on-bar:#FFFFFF;--accent:#7AD6B7;--on-accent:#0C0F0E;--selected:#233630;--mark:#FBE88A;--mark-ink:#1D2321;--danger:#FF9AAB;--head:#272D2B;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font:16px/1.55 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background:var(--bar);color:var(--on-bar);padding:calc(12px + env(safe-area-inset-top)) 24px 12px;position:sticky;top:0;z-index:2}
.top{max-width:900px;margin:auto;display:flex;align-items:center;gap:16px}
h1{font-size:20px;font-weight:700;line-height:1;margin:0;flex:none}
.search{flex:1;min-width:0;border:0;border-radius:6px;padding:9px 12px;background:#fff;color:#1D2321;min-height:42px}
.search::placeholder{color:#5C6663}
.add{background:#fff;color:#1D2321;border:0;border-radius:6px;padding:8px 14px;font-weight:600;min-height:42px;flex:none}
main{max-width:900px;margin:auto;padding:24px}
.status{margin:0 0 12px;color:var(--soft);font-size:14px}
.status:empty{display:none}
.subject{font-size:13px;font-weight:600;color:var(--soft);margin:0 0 8px;line-height:1.35}
.list{list-style:none;margin:0 0 22px;padding:0}
.tabbtn{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 11px;margin-bottom:2px;min-height:48px;font-weight:500;line-height:1.3}
.tabbtn[aria-current=true]{background:var(--selected);font-weight:600}
.tabbtn small{display:block;color:var(--soft);font-weight:400;font-size:13px;margin-top:3px}
.home{background:none;border:0;color:inherit;font:inherit;padding:0;min-height:42px}
.homeview{min-width:0}
.hometitle{font-size:27px;line-height:1.2;font-weight:700;margin:6px 0 22px}
.subjecthead{font-size:15px;font-weight:700;color:var(--soft);margin:24px 0 10px}
.resume .subjecthead{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:15px 16px;min-height:112px;line-height:1.3}
.card .tag{font-size:13px;font-weight:700;color:var(--accent)}
.card .cname{font-size:17px;font-weight:600}
.card .cmeta{font-size:13px;color:var(--soft);margin-top:auto;padding-top:5px}
.card .hit{font-size:13px;color:var(--soft)}
.card:active{background:var(--selected)}
.crumb{background:none;border:0;color:var(--accent);font-weight:600;padding:0;min-height:44px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.chips button{background:var(--selected);border:0;border-radius:999px;padding:8px 13px;min-height:40px;font-size:14px;font-weight:500;line-height:1.25;text-align:left}
.group{margin-bottom:14px}
.group summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:15px;line-height:1.3;padding:10px 11px;min-height:46px;border-radius:6px;background:var(--head);list-style:none}
.group summary::-webkit-details-marker{display:none}

const CANAUX=`## Temps 2 : Les canaux

**Du multicanal à l'omnicanal**

- **Multicanal :** plusieurs canaux indépendants
- **Cross-canal :** les canaux se relaient
- **Omnicanal :** une expérience continue, sans rupture

**Canaux physiques**

- Boutique
- Force de vente terrain
- Salons, distributeurs

**Canaux digitaux**

- Site e-commerce, marketplaces
- E-mailing
- Téléprospection

**Réseaux sociaux**

- Social selling (LinkedIn en BtoB)
- Social commerce (Instagram, TikTok)
- Avis clients`;
const TEMPS3=`## Temps 3 : Comportements d'achat

**Choisir ses canaux selon le parcours client**

Besoin → Recherche → Comparaison → Achat → Usage → Recommandation

- **ROPO :** recherche en ligne, achat en magasin
- **Web-to-store :** click-and-collect, réservation en ligne
- **Showrooming :** on essaie en magasin, on achète en ligne

const SEED=[{"id": "c0", "subject": "Stratégie de développement commercial", "title": "Accueil : présentation du séminaire", "date": "", "body": "Mission Comex : séminaire de 28 heures, Bachelor Chargé de développement commercial, Bloc 1. Pigier Dijon, 2026-2027, Albin Schmidt.\n\n## 4 journées pour conseiller la direction de la Maison Vermeil\n\n| Journée | Thème | Programme |\n| --- | --- | --- |\n| **J1** | Le brief | Cours 1 : fondamentaux. Cours 2 : diagnostic externe et interne. Jeu : le procès de la stratégie. |\n| **J2** | Le cap | Cours 3 : axes de développement, RSE. Cours 4 : prioriser les segments. Évaluation 1 : diagnostic stratégique. |\n| **J3** | Les routes | Cours 5 : canaux et typologies de clients. Cours 6 : objectifs SMART. Jeu : parcours client grandeur nature. |\n| **J4** | Le Comex | Cours 7 : formaliser la recommandation. Cours 8 : présenter et convaincre. Évaluation 2 : soutenance (CCF). |\n\n## Les règles du jeu\n\n- **Cabinets de conseil :** 5 équipes de 4 à 5, un nom, un slogan, des rôles tournants (chef de projet, analyste, garant du temps, porte-parole).\n- **Points de crédibilité :** gagnés pendant les jeux, ils achètent des jokers pour la soutenance. Ils ne comptent pas dans la note.\n- **Coup de théâtre :** en J4, chaque cabinet tire un imprévu à intégrer à sa recommandation.\n\n## Évaluations\n\n- **40 % :** diagnostic stratégique, coef. 2, écrit individuel, J2\n- **60 % :** CCF, coef. 3, soutenance devant le Comex, J4"}, {"id": "c1", "subject": "Stratégie de développement commercial", "title": "Cours 1 : Les fondamentaux de la stratégie de développement commercial", "date": "", "body": "Journée 1, 45 min\n\n**À la fin de ce cours, vous saurez :**\n\n- distinguer stratégie d'entreprise, stratégie commerciale et plan d'actions\n- relier la stratégie commerciale aux leviers de la performance\n- arbitrer entre croissance, rentabilité et pérennité\n\n## L'essentiel\n\nRésumé ajouté pour réviser, il ne vient pas des slides.\n\n- Il y a 3 niveaux : la stratégie d'entreprise fixe le cap, la stratégie commerciale le décline sur le marché, le plan d'actions l'applique à 12 mois.\n- Le CA dépend du nombre de clients, de la fréquence d'achat et du panier moyen.\n- Croissance, rentabilité et pérennité sont en tension : il faut arbitrer.\n\n## Temps 1 : Définir\n\n**Trois niveaux à ne pas confondre**\n\n- **Stratégie d'entreprise :** choix de long terme sur le « où » et le « comment » l'entreprise crée de la valeur. Elle découle de la vision (où veut-on être dans 10 ans ?) et de la mission (pourquoi existe-t-on ?).\n- **Stratégie commerciale :** sa déclinaison sur le marché. Quels clients, quelle offre, quels canaux, quels objectifs de vente.\n- **Plan d'actions commerciales :** sa traduction opérationnelle, à 12 mois. Qui fait quoi, quand, avec quel budget.\n\n**De la vision au terrain : un emboîtement**\n\nVision → Stratégie d'entreprise → Stratégie marketing → Stratégie commerciale → Plan d'actions → Actions terrain\n\n**Exemple Maison Vermeil :**\n\n- **Vision :** « rester la référence du pain d'épices dijonnais »\n- **Stratégie :** « croître de 30 % sans s'industrialiser »\n- **Stratégie commerciale :** « réduire la dépendance à la grande distribution »\n- **Plan :** « recruter un commercial BtoB en 2027 »\n\n## Temps 2 : Le rôle dans la performance\n\n**Trois leviers pour faire progresser le chiffre d'affaires**\n\nCA = nombre de clients × fréquence d'achat × panier moyen\n\n- **Le volume :** conquérir de nouveaux clients, faire racheter plus souvent.\n- **Le prix :** augmenter la valeur perçue et le panier moyen.\n- **La marge :** vendre les produits les plus rentables, réduire le coût d'acquisition.\n\n**Marketing et commercial : complémentaires, pas concurrents**\n\n| Stratégie marketing | Stratégie commerciale |\n| --- | --- |\n| Étudier le marché | Conquérir de nouveaux clients |\n| Segmenter et cibler | Vendre et négocier |\n| Positionner l'offre | Fidéliser et développer le portefeuille |\n| Construire le mix (produit, prix, distribution, communication) | Piloter la force de vente et les canaux |\n\n## Temps 3 : Croissance, rentabilité, pérennité\n\n**Trois enjeux en tension permanente**\n\n| Enjeu | Définition | Indicateurs |\n| --- | --- | --- |\n| **Croissance** | Hausse du CA ou des parts de marché | Taux de croissance, part de marché, nouveaux clients |\n| **Rentabilité** | Capacité à dégager de la marge | Taux de marge, coût d'acquisition client (CAC), valeur vie client (CLV) |\n| **Pérennité** | Capacité à durer | Dépendance au 1er client (alerte au-delà de 30 % du CA), fidélisation, diversification |\n\nCroître vite peut dégrader la marge. Tout miser sur la marge peut fragiliser la pérennité.\n\n## À retenir\n\nUne stratégie commerciale se juge à sa cohérence avec la stratégie d'entreprise et à son effet sur les 3 enjeux.\n\n## À vous de jouer : le procès de la stratégie\n\nTrois équipes plaident chacune pour un enjeu (croissance, rentabilité, pérennité) sur un cas réel. Les autres cabinets forment le jury et rendent leur verdict.\n\n## Mots-clés\n\n- **CA :** chiffre d'affaires.\n- **CAC :** coût d'acquisition client, ce que coûte le gain d'un nouveau client.\n- **CLV :** valeur vie client, ce qu'un client rapporte sur toute sa relation avec l'entreprise.\n\n## Pour réviser\n\n- Quelle différence entre stratégie commerciale et plan d'actions ?\n- Quels sont les 3 leviers du chiffre d'affaires ?\n- À partir de quel seuil la dépendance au 1er client devient-elle une alerte ?", "fiches": [{"q": "Quels sont les 3 niveaux à ne pas confondre ?", "a": "Stratégie d'entreprise, stratégie commerciale, plan d'actions commerciales."}, {"q": "Qu'est-ce que la stratégie d'entreprise ?", "a": "Des choix de long terme sur le « où » et le « comment » l'entreprise crée de la valeur. Elle découle de la vision et de la mission."}, {"q": "Quelle différence entre vision et mission ?", "a": "Vision : où veut-on être dans 10 ans ? Mission : pourquoi existe-t-on ?"}, {" on", "x": "Croissance, rentabilité et pérennité se tirent dessus : il faut arbitrer entre les trois.", "v": "row", "items": ["Croissance", "Rentabilité", "Pérennité"], "plain": true}]}}, {"id": "c2", "subject": "Stratégie de développement commercial", "title": "Cours 2 : Analyser les contraintes externes et internes", "date": "", "body": "Journée 1, 45 min\n\n**À la fin de ce cours, vous saurez :**\n\n- réaliser un PESTEL utile et hiérarchisé\n- analyser la pression concurrentielle avec les 5 forces de Porter\n- identifier les ressources clés et en tirer une matrice SWOT / TOWS\n\n## L'essentiel\n\nRésumé ajouté pour réviser, il ne vient pas des slides.\n\n- Le diagnostic externe utilise le PESTEL et les 5 forces de Porter.\n- Le diagnostic interne recense les ressources et teste leur valeur avec la grille VRIO.\n- Le SWOT fait le constat, le TOWS en tire des pistes d'action.\n\n## Temps 1 : Le diagnostic externe\n\n**Le PESTEL : six familles de facteurs externes**\n\n| Famille | Exemples de facteurs |\n| --- | --- |\n| **P : Politique** | Stabilité, politiques publiques, aides, commerce international |\n| **É : Économique** | Pouvoir d'achat, inflation, prix des matières premières, taux |\n| **S : Sociologique** | Modes de vie, démographie, tendances de consommation |\n| **T : Technologique** | Innovations produits et process, digitalisation |\n| **É : Écologique** | Climat, ressources, attentes environnementales |\n| **L : Légal** | Lois, normes, étiquetage, protection du consommateur |\n\n**Les 5 forces de Porter : qui capte la valeur du marché ?**\n\n- **Rivalité entre concurrents :** la force au centre, sur laquelle pèsent les quatre autres\n- **Nouveaux entrants :** facile ou difficile d'entrer ?\n- **Produits de substitution :** autre réponse au même besoin\n- **Pouvoir des fournisseurs :** capacité à imposer prix et conditions\n- **Pouvoir des clients :** capacité à négocier les prix\n\n## Temps 2 : Le diagnostic interne\n\n**De quoi dispose l'entreprise ?**\n\n- **Humaines :** compétences, savoir-faire, effectifs\n- **Financières :** trésorerie, capacité d'investissement\n- **Matérielles :** sites, machines, capacité de production\n- **Immatérielles :** marque, brevets, fichier clients, réputation\n\n**La grille VRIO : une ressource est un avantage durable si elle est :**\n\n- **V : Valorisable :** elle crée de la valeur pour le client\n- **R : Rare :** peu de concurrents la possèdent\n- **I : difficilement Imitable**\n- **O : bien Organisée** pour être exploitée\n\n## Temps 3 : La synthèse\n\n**Du SWOT au TOWS : passer du constat aux pistes**\n\nLe SWOT : un constat.\n\n|  | Positif | Négatif |\n| --- | --- | --- |\n| **Interne** | Forces | Faiblesses |\n| **Externe** | Opportunités | Menaces |\n\nLa matrice TOWS croise les cases :\n\n| Croisement | Posture | Action |\n| --- | --- | --- |\n| **F × O** | Attaquer | Utiliser ses forces pour saisir les opportunités |\n| **F × M** | Se défendre | Utiliser ses forces contre les menaces |\n| **Fa × O** | Se renforcer | Corriger ses faiblesses grâce aux opportunités |\n| **Fa × M** | Se protéger | Limiter l'exposition |\n\n## À retenir\n\nUn diagnostic n'est utile que s'il débouche sur une question stratégique claire.\n\n## À vous de jouer : l'enquête PESTEL\n\nChaque cabinet reçoit des enveloppes d'indices (articles, chiffres) sur le marché de la Maison Vermeil et reconstitue le puzzle. Puis analyse interne et SWOT de l'entreprise.\n\n## Mots-clés\n\n- **PESTEL :** Politique, Économique, Sociologique, Technologique, Écologique, Légal.\n- **VRIO :** Valorisable, Rare, difficilement Imitable, bien Organisée.\n- **SWOT :** Forces, Faiblesses, Opportunités, Menaces (en anglais : Strengths, Weaknesses, Opportunities, Threats).\n\n## Pour réviser\n\n- Quelles sont les 5 forces de Porter ?\n- À quelles conditions une ressource est-elle un avantage durable ?\n- Que signifie la posture F × O dans la matrice TOWS ?", "fiches": [{"q": "Que signifie PESTEL ?", "a": "Politique, Économique, Sociologique, Technologique, Écologique, Légal."}, {"q": "Quelles sont les 5 forces de Porter ?", "a": "Rivalité entre concurrents, nouveaux entrants, produits de substitution, pouvoir des fournisseurs, pouvoir des clients."}, {"q": "Qu'est-ce qu'un produit de substitution ?", "a": "Une autre réponse au même besoin."}, {"q": "Quels sont les 4 types de ressources internes ?", "a": "Humaines, financières, matérielles et immatérielles."}, {"q": "Que signifie VRIO ?", "a": "Valorisable, Rare, difficilement Imitable, bien Organisée."}, {"q": "Dans un SWOT, qu'est-ce qui est interne et externe ?", "a": "Interne : forces et faiblesses. Externe : opportunités et menaces."}, {"q": "Quelle différence entre SWOT et TOWS ?", "a": "Le SWOT fait un constat, le TOWS croise les cases pour trouver des pistes."}, {"q": "Que signifient les 4 croisements du TOWS ?", "a": "F × O : attaquer. F × M : se défendre. Fa × O : se renforcer. Fa × M : se protéger."}, {"q": "Quand un diagnostic est-il utile ?", "a": "Quand il débouche sur une question stratégique claire."}, {"q": "Exercice : une hausse du prix des matières premières. Quelle famille du PESTEL ?", "a": "Économique."}, {"q": "Exercice : une marque très réputée. Force, faiblesse, opportunité ou menace ?", "a": "Une force : c'est interne et positif."}, {"q": "Exercice : un nouveau concurrent arrive sur le marché. Case du SWOT ?", "a": "Une menace : c'est externe et négatif."}], "anim": {"titre": "Du diagnostic aux pistes d'action", "scenes": [{"t": "Le PESTEL", "x": "Six familles de facteurs externes : politique, économique, sociologique, technologique, écologique et légal.", "v": "row", "items": ["Politique", "Économique", "Sociologique", "Technologique", "Écologique", "Légal"], "plain": true}, {"t": "Les 5 forces de Porter", "x": "Au centre, la rivalité entre concurrents. Autour, les nouveaux entrants, le pouvoir des clients, les produits de substitution et le pouvoir des fournisseurs.", "v": "cross", "items": ["Rivalité entre **Diversification :** nouveaux produits, nouveaux marchés. Risque le plus élevé. |\n\nPlus on s'éloigne de la case de départ, plus le risque grimpe.\n\n**Exemples Maison Vermeil :**\n\n- Vendre le pain d'épices au Japon : développement de marchés\n- Lancer une gamme snacking pour les 18-35 ans : développement de produits… et de marchés\n\n## Temps 2 : Choisir son axe\n\n**Les trois axes du programme**\n\n| Axe | En pratique | À noter |\n| --- | --- | --- |\n| **1. Conquête de nouveaux marchés** | Prospection, nouvelles zones, nouveaux canaux | Coûteux : acquérir un client coûte souvent bien plus cher que le conserver |\n| **2. Nouveaux segments clients** | Adresser une cible voisine avec une offre adaptée | Ex. : cadeaux d'affaires pour les entreprises |\n| **3. Fidélisation et montée en valeur** | Rétention, vente additionnelle, montée en gamme | Indicateurs : taux de rétention, panier moyen, CLV |\n\n**Avant de choisir :** segmenter son portefeuille (méthode ABC, loi de Pareto : souvent, 20 % des clients font 80 % du CA).\n\n## Temps 3 : Contraintes, RSE, accessibilité\n\n**RSE et accessibilité : contraintes et leviers**\n\n**Les contraintes**\n\n- Internes : budget, équipe, capacité de production\n- Externes : réglementation, concurrence\n- Elles filtrent les axes possibles\n\n**La RSE**\n\n- Enjeux sociaux, environnementaux, économiques (ISO 26000)\n- Achats responsables, circuits courts, emballages, éthique de la vente\n- Pas de greenwashing : allégations encadrées par la loi Climat et Résilience (2021)\n\n**L'accessibilité**\n\n- Rendre l'offre accessible à tous, y compris aux personnes en situation de handicap\n- Lieux de vente, sites web, supports\n- European Accessibility Act : e-commerce concerné depuis juin 2025\n\nLa RSE et l'accessibilité ouvrent aussi des marchés et différencient l'offre.\n\n## À retenir\n\nChoisir un axe, c'est renoncer aux autres. Le choix doit être justifié par le diagnostic.\n\n## Mots-clés\n\n- **RSE :** responsabilité sociétale des entreprises.\n- **Loi de Pareto :** ici, l'idée que 20 % des clients font souvent 80 % du CA.\n- **Greenwashing :** présenter une offre comme plus écologique qu'elle ne l'est.\n\n## Pour réviser\n\n- Quelles sont les 4 cases de la matrice d'Ansoff ?\n- Quelle case présente le risque le plus élevé ?\n- Pourquoi segmenter son portefeuille avant de choisir un axe ?", "fiches": [{"q": "Quelles sont les 4 voies de la matrice d'Ansoff ?", "a": "Pénétration, développement de produits, développement de marchés, diversification."}, {"q": "Qu'est-ce que la pénétration ?", "a": "Produits actuels sur marchés actuels : vendre plus aux clients actuels. Risque faible."}, {"q": "Quelle voie d'Ansoff est la plus risquée ?", "a": "La diversification : nouveaux produits sur nouveaux marchés."}, {"q": "Vendre le pain d'épices au Japon, c'est quoi ?", "a": "Du développement de marchés."}, {"q": "Quels sont les 3 axes du programme ?", "a": "Conquête de nouveaux marchés, nouveaux segments clients, fidélisation et montée en valeur."}, {"q": "Que dit la loi de Pareto ici ?", "a": "Souvent, 20 % des clients font 80 % du CA."}, {"q": "Quels sont les 3 enjeux de la RSE ?", "a": "Sociaux, environnementaux et économiques (ISO 26000)."}, {"q": "Quelle loi encadre les allégations écologiques ?", "a": "La loi Climat et Résilience (2021)."}, {"q": "Depuis quand l'e-commerce est-il concerné par l'European Accessibility Act ?", "a": "Depuis juin 2025."}, {"q": "Que faut-il retenir du choix d'un axe ?", "a": "Choisir un axe, c'est renoncer aux autres, et le choix doit être justifié par le diagnostic."}, {"q": "Exercice : lancer un nouveau produit pour les clients actuels. Quelle case d'Ansoff ?", "a": "Développement de produits."}, {"q": "Exercice : vendre plus aux clients actuels avec les produits actuels. Quelle case d'Ansoff ?", "a": "Pénétration."}], "anim": {"titre": "La matrice d'Ansoff", "scenes": [{"t": "Pénétration", "x": "On part de la case de départ : produits actuels sur marchés actuels. On vend plus aux clients actuels. Risque faible.", "v": "grid", "items": ["Pénétration", "Développement de produits", "Développement de marchés", "Diversification"], "on": 0}, {"t": "Développement de produits", "x": "De nouveaux produits pour les clients actuels.", "v": "grid", "items": ["Pénétration", "Développement de produits", "Développement de marchés", "Diversification"], "on": 1}, {"t": "Développement de marchés", "x": "Les produits actuels sur de nouvelles zones, de nouveaux segments ou de nouveaux canaux.", "v": "grid", "items": ["Pénétration", "Développement de produits", "Développement de marchés", "Diversification"], "on": 2}, {"t": "Diversification", "x": "Nouveaux produits et nouveaux marchés : c'est le risque le plus élevé.", "v": "grid", "items": ["Pénétration", "Développement de produits", "Développement de marchés", "Diversification"], "on": 3}, {"t": "À retenir", "x": "Plus on s'éloigne de la case de départ, plus le risque grimpe. Et choisir un axe, c'est renoncer aux autres.", "v": "big", "items": ["Choisir, c'est renoncer"]}]}}, {"id": "c4", "subject": "Stratégie de développement commercial", "title": "Cours 4 : Prioriser les segments", "date": "2026-11-05", "body": "Journée 2\n\n## L'essentiel\n\nRésumé ajouté pour réviser, il ne vient pas des slides.\n\n- Potentiel annuel = clients potentiels × panier moyen × achats par an.\n- On évalue ensuite la rentabilité et le risque de chaque segment.\n- Une grille de scoring pondérée classe les segments : prioritaires, secondaires ou à écarter.\n\n## Temps 1 : Mesurer le potentiel\n\n**Calculer le potentiel d'un segment**\n\nPotentiel annuel = clients potentiels × panier moyen × achats par an\n\n**Exemple :**\n\n- 1 200 entreprises de plus de 20 salariés en Côte-d'Or\n- 1 800 € de panier moyen\n- 1,5 achat par an\n- **Potentiel annuel :** 1 200 × 1 800 × 1,5 = **3,24 M€**\n\n**À distinguer :** le marché total, le marché accessible et la part réellement captable.\n\n## Temps 2 : Rentabilité et risque\n\n**Évaluer la rentabilité**\n\n- Marge attendue\n- Coût d'acquisition\n- Coût de service\n- Délai de retour sur investissement\n\n**Évaluer le risque**\n\n- Intensité concurrentielle\n- Barrières à l'entrée\n- Dépendance\n- Incertitude réglementaire\n\n**Choisir une stratégie selon l'attrait du segment et les atouts de l'entreprise**\n\n| Attrait du segment | Atouts forts | Atouts faibles |\n| --- | --- | --- |\n| **Fort** | **Investir** | **Construire** |\n| **Faible** | **Rentabiliser** | **Renoncer** |\n\n## Temps 3 : Hiérarchiser\n\n**Utiliser une grille de scoring pondérée**\n\n| Critère | Poids | Touristes | Entreprises | 18-35 ans |\n| --- | --- | --- | --- | --- |\n| Potentiel | 30 % | 4 | 5 | 3 |\n| Marge | 25 % | 5 | 4 | 4 |\n| Risque (5 = faible) | 20 % | 4 | 3 | 2 |\n| Accessibilité | 15 % | 4 | 3 | 3 |\n| Cohérence RSE | 10 % | 3 | 4 | 3 |\n| **Score pondéré /5** | **100 %** | **4,15** | **3,95** | **3,05** |\n\n**Résultat :** les touristes arrivent en tête avec 4,15/5.\n\n**Classer les segments**\n\n- **Prioritaires :** attaquer\n- **Secondaires :** tester\n- **À écarter :** renoncer\n\n## Mots-clés\n\n- **Marché accessible :** la partie du marché total que l'entreprise peut réellement atteindre.\n- **Scoring pondéré :** une note par critère, multipliée par le poids du critère, puis additionnée.\n\n## Pour réviser\n\n- Calcule le potentiel de 1 200 clients, avec 1 800 € de panier et 1,5 achat par an.\n- Que faire d'un segment très attractif quand les atouts de l'entreprise sont faibles ?\n- Quels critères d'évaluation du risque peux-tu citer ?", "fiches": [{"q": "Quelle est la formule du potentiel annuel ?", "a": "Clients potentiels × panier moyen × achats par an."}, {"q": "Quel est le potentiel de 1 200 clients, 1 800 € de panier et 1,5 achat par an ?", "a": "3,24 M€."}, {"q": "Quels marchés faut-il distinguer ?", "a": "Le marché total, le marché accessible et la part réellement captable."}, {"q": "Quels critères évaluent la rentabilité ?", "a": "Marge attendue, coût d'acquisition, coût de service, délai de retour sur investissement."}, {"q": "Quels critères évaluent le risque ?", "a": "Intensité concurrentielle, barrières à l'entrée, dépendance, incertitude réglementaire."}, {"q": "Attrait fort et atouts forts : que faire ?", "a": "Investir."}, {"q": "Attrait fort et atouts faibles : que faire ?", "a": "Construire."}, {"q": "Attrait faible et atouts forts : que faire ?", "a": "Rentabiliser."}, {"q": "Attrait faible et atouts faibles : que faire ?", "a": "Renoncer."}, {"q": "Que fait-on de chaque catégorie de segments ?", "a": "Prioritaires : attaquer. Secondaires : tester. À écarter : renoncer."}, {"q": "Exercice : 500 clients potentiels, panier de 200 €, 3 achats par an. Quel potentiel annuel ?", "a": "500 × 200 × 3 = 300 000 €."}, {"q": "Exercice : poids 50 % / 50 %, notes 4 et 2. Quel score pondéré ?", "a": "4 × 0,5 + 2 × 0,5 = 3 sur 5."}, {"q": "Exercice : un segment peu attractif où l'entreprise a de forts atouts. Quelle stratégie ?", "a": "Rentabiliser."}], "anim": {"titre": "Calculer et classer les segments", "scenes": [{"t": "La formule", "x": "Le potentiel annuel se calcule ainsi : clients potentiels, multipliés par le panier moyen, multipliés par le nombre d'achats par an.", "v": "big", "items": ["Clients × panier × achats par an"]}, {"t": "L'exemple du cours", "x": "Mille deux cents entreprises, mille huit cents euros de panier, un virgule cinq achat par an : trois virgule vingt-quatre millions d'euros.", "v": "big", "items": ["1 200 × 1 800 € × 1,5 = 3,24 M€"]}, {"t": "Attention au marché", "x": "Le potentiel total n'est pas ce que l'on va gagner. On distingue le marché total, le marché accessible et la part réellement captable.", "v": "ring", "items": ["Marché total", "Marché accessible", "Part captable"], "on": 2}, {"t": "Choisir une stratégie", "x": "On croise l'attrait du segment et les atouts de l'entreprise : investir, construire, rentabiliser ou renoncer.", "v": "grid", "items": ["Investir", "Construire", "Rentabiliser", "Renoncer"], "on": 0}, {"t": "La grille de scoring", "x": "Chaque critère reçoit une note et un poids. Dans l'exemple, les touristes arrivent en tête avec quatre virgule quinze sur cinq.", "v": "big", "items": ["Touristes 4,15 · Entreprises 3,95 · 18-35 ans 3,05"]}]}}, {"id": "c5", "subject": "Stratégie de développement commercial", "title": "Cours 5 : Stratégies par canaux et par typologies de clients", "date": "2026-11-05", "body": "Journée 3, 45 min\n\n**À la fin de ce cours, vous saurez :**\n\n- adapter sa stratégie au BtoB et au BtoC\n- distinguer multicanal, cross-canal et omnicanal\n- construire un mix canaux à partir du parcours client\n\n## L'essentiel\n\nRésumé ajouté pour réviser, il ne vient pas des slides.\n\n- BtoC et BtoB n'achètent pas de la même façon : décideur, processus, volume et relation diffèrent.\n- On passe du multicanal (canaux indépendants) à l'omnicanal (expérience continue).\n- Le choix des canaux part du parcours client.\n\n## Temps 1 : BtoB et BtoC\n\n**BtoC et BtoB : deux façons d'acheter**\n\n| Critère | BtoC | BtoB |\n| --- | --- | --- |\n| Décideur | Un individu ou un foyer | Un centre d'achat : prescripteur, utilisateur, acheteur, décideur, filtre |\n| Processus | Court, souvent émotionnel | Long, formalisé : appel d'offres, référencement |\n| Volume | Nombreux clients, petits paniers | Peu de clients, gros contrats |\n| Relation | Marque, expérience | Personnalisée, gestion de comptes clés (KAM) |\n| Leviers | Communication, promotion, expérience client | Argumentation valeur, négociation, services |\n\n## Temps 2 : Les canaux\n\n**Du multicanal à l'omnicanal**\n\n- **Multicanal :** plusieurs canaux indépendants\n- **Cross-canal :** les canaux se relaient\n- **Omnicanal :** une expérience continue, sans rupture\n\n**Canaux physiques**\n\n- Boutique\n- Force de vente terrain\n- Salons, distributeurs\n\n**Canaux digitaux**\n\n- Site e-commerce, marketplaces\n- E-mailing\n- Téléprospection\n\n**Réseaux sociaux**\n\n- Social selling (LinkedIn en BtoB)\n- Social commerce (Instagram, TikTok)\n- Avis clients\n\n## Temps 3 : Comportements d'achat\n\n**Choisir ses canaux selon le parcours client**\n\nBesoin → Recherche → Comparaison → Achat → Usage → Recommandation\n\n- **ROPO :** recherche en ligne, achat en magasin\n- **Web-to-store :** click-and-collect, réservation en ligne\n- **Showrooming :** on essaie en magasin, on achète en ligne\n- **Avis en ligne :** ils pèsent sur la décision, en BtoC comme en BtoB\n\n**Choisir un canal selon :** la cible, le coût de contact, la marge, le niveau de conseil nécessaire, la capacité logistique.\n\n## Mots-clés\n\n- **KAM :** gestion de comptes clés, le suivi dédié aux clients les plus importants.\n- **ROPO :** recherche en ligne, achat en magasin.\n- **Showrooming :** essayer en magasin, acheter en ligne.\n\n## Pour réviser\n\n- Qui compose le centre d'achat en BtoB ?\n- Quelle différence entre cross-canal et omnicanal ?\n- Selon quels critères choisir un canal ?", "fiches": [{"q": "Qui décide en BtoC et en BtoB ?", "a": "BtoC : un individu ou un foyer. BtoB : un centre d'achat."}, {"q": "Qui compose le centre d'achat, selon ce cours ?", "a": "Prescripteur, utilisateur, acheteur, décideur, filtre."}, {"q": "Quelle différence entre multicanal, cross-canal et omnicanal ?", "a": "Multicanal : canaux indépendants. Cross-canal : ils se relaient. Omnicanal : expérience continue, sans rupture."}, {"q": "Cite des canaux physiques.", "a": "Boutique, force de vente terrain, salons, distributeurs."}, {"q": "Cite des canaux digitaux.", "a": "Site e-commerce, marketplaces, e-mailing, téléprospection."}, {"q": "Quelles sont les étapes du parcours client ?", "a": "Besoin, recherche, comparaison, achat, usage, recommandation."}, {"q": "Qu'est-ce que le ROPO ?", "a": "Recherche en ligne, achat en magasin."}, {"q": "Qu'est-ce que le web-to-store ?", "a": "Click-and-collect, réservation en ligne."}, {"q": "Qu'est-ce que le showrooming ?", "a": "On essaie en magasin, on achète en ligne."}, {"q": "Selon quoi choisir un canal ?", "a": "La cible, le coût de contact, la marge, le niveau de conseil nécessaire, la capacité logistique."}, {"q": "Exercice : un client compare en ligne, puis achète en boutique. Quel comportement ?", "a": "Le ROPO."}, {"q": "Exercice : un client essaie en boutique, puis achète en ligne. Quel comportement ?", "a": "Le showrooming."}], "anim": {"titre": "Du multicanal à l'omnicanal", "scenes": [{"t": "Multicanal", "x": "Plusieurs canaux existent, mais ils restent indépendants.", "v": "row", "items": ["Multicanal", "Cross-canal", "Omnicanal"], "on": 0}, {"t": "Cross-canal", "x": "Les canaux se relaient.", "v": "row", "items": ["Multicanal", "Cross-canal", "Omnicanal"], "on": 1}, {"t": "Omnicanal", "x": "Le client vit une expérience continue, sans rupture.", "v": "row", "items": ["Multicanal", "Cross-canal", "Omnicanal"], "on": 2}, {"t": "Le parcours client", "x": "On choisit ses canaux en suivant le parcours : besoin, recherche, comparaison, achat, usage et recommandation.", "v": "row", "items": ["Besoin", "Recherche", "Comparaison", "Achat", "Usage", "Recommandation"]}, {"t": "Trois comportements à connaître", "x": "ROPO : recherche en ligne, achat en magasin. Web-to-store : click-and-collect ou réservation en ligne. Showrooming : on essaie en magasin, on achète en ligne.", "v": "row", "items": ["ROPO", "Web-to-store", "Showrooming"], "plain": true}]}}, {"id": "c6", "subject": "Stratégie de développement commercial", "title": "Cours 6 : Définir des objectifs commerciaux", "date": "2026-11-05", "body": "Journée 3, 45 min\n\n**À la fin de ce cours, vous saurez :**\n\n- fixer des objectifs à court, moyen et long terme\n- rédiger des objectifs SMART\n- vérifier la cohérence entre objectifs, moyens et ressources\n\n## L'essentiel\n\nRésumé ajouté pour réviser, il ne vient pas des slides.\n\n- Les objectifs se déclinent en cascade : long terme, moyen terme, court terme.\n- Un bon objectif est SMART et mesuré par un indicateur.\n- Il doit être cohérent avec les moyens et les ressources disponibles.\n\n## Temps 1 : Les horizons\n\n**Trois horizons, une cascade**\n\n| Horizon | Durée | Type d'objectifs | Exemples d'indicateurs | Précision |\n| --- | --- | --- | --- | --- |\n| **Long terme** | 3 à 5 ans | Stratégiques | Part de marché, nouveau marché, notoriété | Ex. : +30 % de CA en 3 ans |\n| **Moyen terme** | 1 à 3 ans | Tactiques | Nouveaux clients par segment, CA par canal | |\n| **Court terme** | Moins d'1 an | Opérationnels | Rendez-vous, taux de transformation, panier moyen | Déclinés par commercial et par mois |\n\n## Temps 2 : SMART\n\n**La méthode SMART**\n\n- **S :** Spécifique\n- **M :** Mesurable\n- **A :** Atteignable\n- **R :** Réaliste\n- **T :** Temporellement défini\n\n**Flou :** « Développer les ventes en ligne »\n\n**SMART :** « Passer le CA e-commerce de 150 k€ à 250 k€ d'ici le 31 décembre 2027 »\n\n**Types d'objectifs :** quantitatifs (CA, volume, marge, clients) ou qualitatifs (satisfaction, notoriété, image RSE), toujours mesurés par un indicateur.\n\n## Temps 3 : Cohérence objectifs, moyens, ressources\n\n**Un objectif sans moyens est un vœu**\n\n**Exemple :**\n\n- 40 nouveaux clients BtoB visés\n- 20 % de taux de transformation\n- 200 rendez-vous nécessaires\n- **Soit environ 4 rendez-vous par semaine**\n\n**Pour chaque objectif :** quels moyens (actions, budget, outils) et quelles ressources (personnes, temps) ?\n\n**Outils de contrôle :** tableau de bord commercial, indicateurs clés (KPI), points d'étape.\n\n## Mots-clés\n\n- **SMART :** Spécifique, Mesurable, Atteignable, Réaliste, Temporellement défini.\n- **KPI :** indicateur clé de performance.\n- **Taux de transformation :** la part des rendez-vous ou contacts qui deviennent des ventes.\n\n## Pour réviser\n\n- Rends SMART l'objectif « Développer les ventes en ligne ».\n- Avec 40 clients visés et 20 % de transformation, combien faut-il de rendez-vous ?\n- Quels outils permettent de contrôler l'atteinte d'un objectif ?", "fiches": [{"q": "Quels sont les 3 horizons d'objectifs ?", "a": "Long terme (3 à 5 ans), moyen terme (1 à 3 ans), court terme (moins d'1 an)."}, {"q": "Quel type d'objectif correspond à chaque horizon ?", "a": "Long : stratégiques. Moyen : tactiques. Court : opérationnels."}, {"q": "Que signifie SMART ?", "a": "Spécifique, Mesurable, Atteignable, Réaliste, Temporellement défini."}, {"q": "Donne un objectif SMART.", "a": "« Passer le CA e-commerce de 150 k€ à 250 k€ d'ici le 31 décembre 2027 »."}, {"q": "Quelle différence entre objectifs quantitatifs et qualitatifs ?", "a": "Quantitatifs : CA, volume, marge, clients. Qualitatifs : satisfaction, notoriété, image RSE. Les deux se mesurent par un indicateur."}, {"q": "40 clients visés, 20 % de transformation : combien de rendez-vous ?", "a": "200 rendez-vous, soit environ 4 par semaine."}, {"q": "Que faut-il prévoir pour chaque objectif ?", "a": "Des moyens (actions, budget, outils) et des ressources (personnes, temps)."}, {"q": "Quels sont les outils de contrôle ?", "a": "Tableau de bord commercial, indicateurs clés (KPI), points d'étape."}, {"q": "Exercice : 30 nouveaux clients visés, 25 % de transformation. Combien de rendez-vous ?", "a": "30 ÷ 0,25 = 120 rendez-vous."}, {"q": "Exercice : « Augmenter la notoriété ». Pourquoi n'est-ce pas SMART ?", "a": "Ce n'est ni chiffré ni daté, donc on ne peut pas le mesurer."}], "anim": {"titre": "Un objectif qui tient la route", "scenes": [{"t": "Trois horizons", "x": "Les objectifs descendent en cascade : long terme, moyen terme, puis court terme.", "v": "row", "items": ["Long terme : 3 à 5 ans", "Moyen terme : 1 à 3 ans", "Court terme : moins d'1 an"]}, {"t": "La méthode SMART", "x": "Un objectif doit être spécifique, mesurable, atteignable, réaliste et temporellement défini.", "v": "row", "items": ["Spécifique", "Mesurable", "Atteignable", "Réaliste", "Temporel"], "plain": true}, {"t": "Flou ou SMART ?", "x": "Développer les ventes en ligne, c'est flou. Passer le chiffre d'affaires e-commerce de 150 à 250 mille euros d'ici fin 2027, c'est SMART.", "v": "big", "items": ["150 k€ → 250 k€ d'ici le 31/12/2027"]}, {"t": "Vérifier les moyens", "x": "Quarante clients visés avec vingt pour cent de transformation, cela demande deux cents rendez-vous, soit environ quatre par semaine.", "v": "big", "items": ["40 ÷ 20 % = 200 rendez-vous"]}, {"t": "À retenir", "x": "Un objectif sans moyens est un vœu.", "v": "big", "items": ["Un objectif sans moyens est un vœu"]}]}}, {"id": "em0", "subject": "Étude de marché et veille", "title": "Accueil : présentation du séminaire", "date": "", "body": "Agence Radar : séminaire de 21 heures, Bachelor Chargé de développement commercial, Bloc 1. Pigier Dijon, 2026-2027, Albin Schmidt.\n\n## 3 journées pour allumer le radar et rendre un verdict\n\n| Journée | Thème | Programme |\n| --- | --- | --- |\n| **J1** | Allumer le radar | Cours 1 : la veille stratégique et commerciale. Cours 2 : sources, outils et veille augmentée par l'IA. Jeux : Vrai ou Fake ? La chasse aux sources. |\n| **J2** | Sonder le marché | Cours 3 : méthodologie de l'étude de marché. Cours 4 : marché et comportements d'achat. Évaluation 1 : diagnostic stratégique. |\n| **J3** | Rendre le verdict | Cours 5 : environnement concurrentiel. Cours 6 : synthèse et analyse critique de l'IA. Évaluation 2 : restitution à la direction (CCF). |\n\n## Les règles du jeu\n\n- **Cabinets d'études :** 5 équipes, un nom, un slogan, des rôles tournants (chef de projet, analyste données, responsable des sources, porte-parole).\n- **Le défi IA :** chaque jour, on compare le travail humain et celui de l'IA. Le cabinet qui débusque le plus d'erreurs gagne.\n\n## Évaluations\n\n- **50 % :** diagnostic stratégique, coef. 2, écrit individuel, J2\n- **50 % :** CCF, coef. 2, restitution à la direction, J3\n\n## Vos terrains d'étude\n\n**Cinq entreprises réelles, cinq cabinets**\n\n| Cabinet | Entreprise | Secteur | Problématique |\n| --- | --- | --- | --- |\n| 1 | Mulot & Petitjean | Pain d'épices, Dijon | Comment faire aimer le pain d'épices aux 18-35 ans ? |\n| 2 | Moutarderie Fallot | Moutarde, Beaune | Les coffrets cadeaux d'entreprise sont-ils une opportunité ? |\n| 3 | Lejay Lagoute | Crème de cassis, Dijon | Comment relancer la crème de cassis auprès des jeunes adultes et des bars ? |\n| 4 | Laboratoires Urgo | Soins, Chenôve | Comment se différencier face aux marques de distributeur et à la vente en ligne ? |\n| 5 | Fromagerie Gaugry | Fromages, Brochon | Quel public et quelle offre pour la réouverture de l'espace de visite ? |"}, {"id": "em1", "subject": "Étude de marché et veille", "title": "Cours 1 : La veille stratégique et commerciale", "date": "", "body": "Journée 1, 45 min\n\n**À la fin de ce cours, vous saurez :**\n\n- expliquer à quoi sert la veille dans le développement commercial\n- distinguer les quatre types de veille\n- organiser un dispositif de veille : objectifs, acteurs, fréquence\n\n## L'essentiel\n\nRésumé ajouté pour réviser, il ne vient pas des slides.\n\n- La veille transforme des données en connaissances utiles à la décision.\n- Il existe 4 types de veille : concurrentielle, technologique et digitale, réglementaire et juridique, sociétale et comportementale.\n- Un dispositif suit un cycle de 5 étapes et précise ses objectifs, ses acteurs et sa fréquence.\n\n## Temps 1 : Enjeux de la veille\n\n**Veiller, c'est transformer des données en décisions**\n\nDonnée (brute, sans contexte) → Information (mise en contexte) → Connaissance (analysée, utile à la décision)\n\n- **Repérer des opportunités :** nouveaux besoins, appels d'offres, nouveaux marchés\n- **Anticiper les menaces :** nouvel entrant, baisse de prix, nouvelle loi\n- **Adapter l'offre :** faire évoluer produits, prix et services\n- **Nourrir les commerciaux :** des arguments à jour face aux clients\n\n## Temps 2 : Typologies\n\n**Quatre types de veille**\n\n| Type | Ce qu'on surveille | Exemple |\n| --- | --- | --- |\n| **Concurrentielle** | Offres, prix, communication, recrutements des concurrents | Cyclonef : un loueur national ouvre une agence à Dijon |\n| **Technologique et digitale** | Innovations produits et process, outils numériques | Antivols connectés, applications de gestion de flotte |\n| **Réglementaire et juridique** | Lois, normes, fiscalité, étiquetage | Forfait mobilités durables, aides à l'achat de vélos |\n| **Sociétale et comportementale** | Tendances de consommation, valeurs, modes de vie | Essor des trajets domicile-travail à vélo |\n\n## Temps 3 : Organiser un dispositif\n\n**Le cycle de la veille**\n\nDéfinir les besoins → Collecter → Traiter et analyser → Diffuser → Exploiter et évaluer\n\n- **Objectifs :** quelles questions la direction se pose-t-elle ? 3 à 5 axes de surveillance, avec des mots-clés.\n- **Acteurs :** un pilote, des capteurs (commerciaux, service client, achats), des destinataires (direction, marketing).\n- **Fréquence :** alertes en continu, synthèse hebdomadaire ou mensuelle, bilan trimestriel.\n\n## À retenir\n\nUne veille sans question précise produit du bruit ; une veille sans diffusion ne sert à rien.\n\n## À vous de jouer : qui aurait dû voir venir ?\n\n6 cas réels d'entreprises surprises par leur marché : retrouvez le type de veille qui les aurait alertées. Puis rédigez le plan de veille de votre entreprise : objectifs, types de veille, acteurs, fréquence.\n\n## Mots-clés\n\n- **Veille :** surveiller son environnement pour éclairer les décisions.\n- **Capteur :** une personne qui fait remonter des informations du terrain.\n- **Bruit :** des informations collectées qui n'aident à aucune décision.\n\n## Pour réviser\n\n- Quelle différence entre donnée, information et connaissance ?\n- Quels sont les 4 types de veille ?\n- Quelles sont les 5 étapes du cycle de la veille ?", "fiches": [{"q": "Quelle différence entre donnée, information et connaissance ?", "a": "Donnée : brute, sans contexte. Information : mise en contexte. Connaissance : analysée, utile à la décision."}, {"q": "À quoi sert la veille ?", "a": "Repérer des opportunités, anticiper les menaces, adapter l'offre, nourrir les commerciaux."}, {"q": "Quels sont les 4 types de veille ?", "a": "Concurrentielle, technologique et digitale, réglementaire et juridique, sociétale et comportementale."}, {"q": "Que surveille la veille concurrentielle ?", "a": "Les offres, prix, communication et recrutements des concurrents."}, {"q": "Quelles sont les 5 étapes du cycle de la veille ?", "a": "Définir les besoins, collecter, traiter et analyser, diffuser, exploiter et évaluer."}, {"q": "Combien d'axes de surveillance prévoir ?", "a": "3 à 5 axes, avec des mots-clés."}, {"q": "Qui sont les acteurs de la veille ?", "a": "Un pilote, des capteurs (commerciaux, service client, achats) et des destinataires (direction, marketing)."}, {"q": "Quelle fréquence prévoir pour la veille ?", "a": "Alertes en continu, synthèse hebdomadaire ou mensuelle, bilan trimestriel."}, {"q": "Que faut-il retenir de la veille ?", "a": "Une veille sans question précise produit du bruit ; une veille sans diffusion ne sert à rien."}, {"q": "Exercice : une nouvelle loi sur l'étiquetage. Quel type de veille ?", "a": "Réglementaire et juridique."}, {"q": "Exercice : les gens vont davantage au travail à vélo. Quel type de veille ?", "a": "Sociétale et comportementale."}], "anim": {"titre": "Comment fonctionne la veille", "scenes": [{"t": "De la donnée à la décision", "x": "Une donnée est brute. Mise en contexte, elle devient une information. Analysée, elle devient une connaissance utile à la décision.", "v": "row", "items": ["Donnée", "Information", "Connaissance"], "on": 2}, {"t": "Quatre types de veille", "x": "Concurrentielle, technologique et digitale, réglementaire et juridique, sociétale et comportementale.", "v": "grid", "items": ["Concurrentielle", "Technologique et digitale", "Réglementaire et juridique", "Sociétale et comportementale"]}, {"t": "Le cycle de la veille", "x": "Il faut d'abord définir les besoins, puis collecter, traiter et analyser, diffuser, et enfin exploiter et évaluer.", "v": "row", "items": ["Besoins", "Collecter", "Analyser", "Diffuser", "Exploiter"]}, {"t": "Organiser le dispositif", "x": "On fixe des objectifs, on désigne des acteurs, et on choisit une fréquence.", "v": "row", "items": ["Objectifs", "Acteurs", "Fréquence"], "plain": true}, {"t": "À retenir", "x": "Une veille sans question précise produit du bruit. Une veille sans diffusion ne sert à rien.", "v": "big", "items": ["Une question précise, une vraie diffusion"]}]}}, {"id": "em2", "subject": "Étude de marché et veille", "title": "Cours 2 : Sources, outils et veille augmentée par l'IA", "date": "", "body": "Journée 1, 45 min\n\n**À la fin de ce cours, vous saurez :**\n\n- sélectionner et fiabiliser des sources\n- paramétrer alertes, agrégateurs et tableau de suivi\n- utiliser l'IA pour la veille, sans perdre son esprit critique\n\n## L'essentiel\n\nRésumé ajouté pour réviser, il ne vient pas des slides.\n\n- Il y a 3 familles de sources, à vérifier avec la grille APAEO.\n- Toute information clé se recoupe avec 2 sources indépendantes.\n- Les outils vont des alertes au tableau de suivi. L'IA accélère la veille, mais l'humain vérifie et décide.\n\n## Temps 1 : Sélectionner et fiabiliser les sources\n\n**Trois familles de sources**\n\n| Famille | Exemples |\n| --- | --- |\n| **Institutionnelles** | INSEE, Bpifrance, CCI, Banque de France, data.gouv.fr, Eurostat, OCDE |\n| **Sectorielles et professionnelles** | Fédérations et syndicats professionnels, presse spécialisée, salons, études sectorielles payantes |\n| **Données publiques et privées** | Open data, registres d'entreprises, rapports annuels, panels, études d'instituts, données internes (CRM, ventes) |\n\n**Une grille pour fiabiliser chaque source**\n\n| Lettre | Critère | Question |\n| --- | --- | --- |\n| **A** | Actualité | Quelle date ? |\n| **P** | Pertinence | Utile pour ma question ? |\n| **A** | Auteur | Qui parle ? |\n| **E** | Exactitude | Chiffres sourcés, recoupables ? |\n| **O** | Objectif | Informer, vendre, convaincre ? |\n\n**Toute information clé se recoupe avec 2 sources indépendantes.**\n\n## Temps 2 : Les outils\n\n**Les outils de veille**\n\n**1. Alertes automatisées**\n\n- Alertes sur mots-clés (ex. Google Alerts, Talkwalker Alerts)\n- Alertes des sites officiels\n- Lettres d'information\n\n**2. Agrégateurs de contenus**\n\n- Lecteurs de flux RSS (ex. Feedly, Inoreader)\n- Toutes les sources au même endroit\n\n**3. Tableau de suivi**\n\n- Un tableur partagé\n- Date, source, type de veille, information, impact, action proposée, responsable\n\n## Temps 3 : L'IA au service de la veille\n\n**La veille augmentée par l'IA**\n\n| Ce que l'IA fait bien | Ses limites |\n| --- | --- |\n| Résumer un lot d'articles | Informations inventées (hallucinations) |\n| Regrouper par thème, traduire | Sources absentes ou obsolètes |\n| Repérer des signaux récurrents | Confidentialité des données de l'entreprise |\n| Produire une synthèse hebdomadaire | |\n\n**Le bon prompt de veille :** rôle + contexte + sources fournies + consigne + format attendu\n\n**Exemple :** « Tu es analyste de marché. À partir des 8 articles ci-joints, liste les 5 signaux qui concernent un fabricant de vélos électriques, avec pour chacun la source et l'impact possible. »\n\n## À retenir\n\nL'IA accélère la veille, l'humain vérifie et décide.\n\n## À vous de jouer : la chasse aux sources\n\nEn 45 minutes, trouvez 10 sources sur le marché de votre entreprise et notez-les avec la grille de fiabilité. Bonus pour chaque source institutionnelle. Puis paramétrez vos alertes et votre tableau de suivi.\n\n## Mots-clés\n\n- **Flux RSS :** un abonnement qui récupère automatiquement les nouveaux contenus d'un site.\n- **Agrégateur :** un outil qui réunit plusieurs sources au même endroit.\n- **Hallucination :** une information inventée par une IA.\n- **Prompt :** la consigne donnée à une IA.\n\n## Pour réviser\n\n- Quelles sont les 3 familles de sources ?\n- Que signifie la grille APAEO ?\n- Quelles sont les limites de l'IA pour la veille ?\n- Quels sont les 5 éléments d'un bon prompt de veille ?", "fiches": [{"q": "Quelles sont les 3 familles de sources ?", "a": "Institutionnelles, sectorielles et professionnelles, données publiques et privées."}, {"q": "Cite des sources institutionnelles.", "a": "INSEE, Bpifrance, CCI, Banque de France, data.gouv.fr, Eurostat, OCDE."}, {"q": "Que signifie la grille de fiabilité A-P-A-E-O ?", "a": "Actualité, Pertinence, Auteur, Exactitude, Objectif."}, {"q": "Avec combien de sources recouper une information clé ?", "a": "2 sources indépendantes."}, {"q": "Quels sont les 3 types d'outils de veille ?", "a": "Alertes automatisées, agrégateurs de contenus, tableau de suivi."}, {"q": "Cite un outil d'alerte et un agrégateur.", "a": "Alerte : Google Alerts ou Talkwalker Alerts. Agrégateur : Feedly ou Inoreader."}, {"q": "Que contient le tableau de suivi ?", "a": "Date, source, type de veille, information, impact, action proposée, responsable."}, {"q": "Que fait bien l'IA pour la veille ?", "a": "Résumer des articles, regrouper par thème, traduire, repérer des signaux récurrents, produire une synthèse hebdomadaire."}, {"q": "Quelles sont les limites de l'IA ?", "a": "Informations inventées (hallucinations), sources absentes ou obsolètes, confidentialité des données de l'entreprise."}, {"q": "Que contient un bon prompt de veille ?", "a": "Rôle + contexte + sources fournies + consigne + format attendu."}, {"q": "Exercice : un article sans date ni auteur, écrit pour vendre. Quels critères posent problème ?", "a": "Actualité, Auteur et Objectif."}], "anim": {"titre": "Trouver, vérifier, utiliser", "scenes": [{"t": "Trois familles de sources", "x": "Les sources institutionnelles, les sources sectorielles et professionnelles, et les données publiques et privées.", "v": "row", "items": ["Institutionnelles", "Sectorielles", "Données"], "plain": true}, {"t": "La grille de fiabilité", "x": "Pour chaque source, on vérifie l'actualité, la pertinence, l'auteur, l'exactitude et l'objectif.", "v": "row", "items": ["Actualité", "Pertinence", "Auteur", "Exactitude", "Objectif"], "plain": true}, {"t": "La règle à connaître", "x": "Toute information clé se recoupe avec deux sources indépendantes.", "v": "big", "items": ["1 info clé = 2 sources indépendantes"]}, {"t": "Le bon prompt", "x": "Un bon prompt de veille contient un rôle, un contexte, les sources fournies, une consigne et le format attendu.", "v": "row", "items": ["Rôle", "Contexte", "Sources", "Consigne", "Format"]}, {"t": "À retenir", "x": "L'IA accélère la veille, l'humain vérifie et décide.", "v": "big", "items": ["L'IA accélère, l'humain décide"]}]}}, {"id": "em3", "subject": "Étude de marché et veille", "title": "Cours 3 : Méthodologie de l'étude de marché", "date": "", "body": "Journée 2, 45 min\n\n**À la fin de ce cours, vous saurez :**\n\n- formuler une problématique et des objectifs d'étude\n- choisir entre études documentaire, qualitative et quantitative\n- repérer les biais qui faussent les résultats\n\n## L'essentiel\n\nRésumé ajouté pour réviser, il ne vient pas des slides.\n\n- Une étude part d'une question de décision, puis suit un plan d'étude.\n- Documentaire d'abord, qualitative pour comprendre le pourquoi, quantitative pour mesurer.\n- Il faut connaître les 6 biais pour ne pas tirer de fausses conclusions.\n\n## Temps 1 : Rôle et cadrage\n\n**Une étude répond à une question de décision**\n\n**Problématique de Cyclonef :** « Existe-t-il en Bourgogne-Franche-Comté une demande suffisante et rentable de location longue durée de vélos électriques pour les entreprises, et à quelles conditions ? »\n\n**Le plan d'étude**\n\nObjectifs → Informations nécessaires → Méthode → Échantillon → Calendrier → Budget\n\n## Temps 2 : Les méthodes et la collecte\n\n**Trois méthodes de collecte**\n\n| Méthode | Principe | Outils | Quand l'utiliser |\n| --- | --- | --- | --- |\n| **Documentaire** | Exploiter des données existantes | Statistiques publiques, études sectorielles, presse, données internes | Toujours en premier |\n| **Qualitative** | Comprendre le pourquoi : motivations, freins | Entretiens individuels, focus groups de 6 à 10 personnes | Explorer, faire émerger des idées |\n| **Quantitative** | Mesurer, chiffrer, généraliser | Questionnaires, sondages sur un échantillon représentatif | Valider des hypothèses, dimensionner |\n\n**Échantillon**\n\n- **Environ 400 réponses** pour une marge d'erreur d'environ 5 % sur une grande population\n- **Quotas :** reproduire la structure de la population\n- **Aléatoire :** chacun a la même chance d'être interrogé\n\n**Rédiger un questionnaire**\n\n- Questions fermées et échelles\n- Une seule idée par question\n- Du général au plus personnel\n- Test préalable sur 3 personnes\n\n## Temps 3 : Analyse et limites\n\n**Analyser… et connaître ses biais**\n\n| Biais | Ce que ça veut dire |\n| --- | --- |\n| **Échantillonnage** | L'échantillon ne ressemble pas à la population |\n| **Sélection** | Seuls certains profils répondent |\n| **Formulation** | La question oriente la réponse |\n| **Désirabilité sociale** | On répond ce qui est bien vu |\n| **Confirmation** | On cherche ce que l'on veut voir |\n| **Déclaratif** | Ce que l'on dit ≠ ce que l'on fait |\n\n## À retenir\n\nPas de bonne étude sans bonne question ; pas de conclusion fiable sans connaître ses biais.\n\n## À vous de jouer : le questionnaire le plus affuté du monde\n\nRédigez votre plan d'étude, comparez-le à celui de l'IA et lancez votre questionnaire en ligne.\n\n## Mots-clés\n\n- **Problématique :** la question de décision à laquelle l'étude doit répondre.\n- **Focus group :** un entretien collectif de 6 à 10 personnes.\n- **Échantillon représentatif :** un groupe interrogé qui ressemble à la population étudiée.\n- **Marge d'erreur :** l'écart possible entre le résultat de l'étude et la réalité.\n\n## Pour réviser\n\n- Par quelle méthode commence-t-on toujours ?\n- Combien de réponses pour une marge d'erreur d'environ 5 % ?\n- Quelle différence entre quotas et aléatoire ?\n- Quels sont les 6 biais ?", "fiches": [{"q": "À quoi répond une étude de marché ?", "a": "À une question de décision."}, {"q": "Quelles sont les étapes du plan d'étude ?", "a": "Objectifs, informations nécessaires, méthode, échantillon, calendrier, budget."}, {"q": "Quelles sont les 3 méthodes de collecte ?", "a": "Documentaire, qualitative, quantitative."}, {"q": "Quand utiliser la méthode documentaire ?", "a": "Toujours en premier."}, {"q": "À quoi sert la méthode qualitative ?", "a": "Comprendre le pourquoi (motivations, freins), explorer et faire émerger des idées."}, {"q": "À quoi sert la méthode quantitative ?", "a": "Mesurer, chiffrer, généraliser, valider des hypothèses et dimensionner."}, {"q": "Combien de personnes dans un focus group ?", "a": "6 à 10 personnes."}, {"q": "Combien de réponses pour une marge d'erreur d'environ 5 % ?", "a": "Environ 400, sur une grande population."}, {"q": "Quelle différence entre quotas et aléatoire ?", "a": "Quotas : reproduire la structure de la population. Aléatoire : chacun a la même chance d'être interrogé."}, {"q": "Quelles sont les règles d'un bon questionnaire ?", "a": "Questions fermées et échelles, une seule idée par question, du général au plus personnel, test préalable sur 3 personnes."}, {"q": "Quels sont les 6 biais ?", "a": "Échantillonnage, sélection, formulation, désirabilité sociale, confirmation, déclaratif."}, {"q": "Exercice : les gens disent trier leurs déchets, sans le faire. Quels biais ?", "a": "Désirabilité sociale et déclaratif."}, {"q": "Exercice : « Ne pensez-vous pas que ce produit est excellent ? ». Quel biais ?", "a": "Le biais de formulation : la question oriente la réponse."}, {"q": "Exercice : tu veux comprendre les freins à l'achat. Quelle méthode ?", "a": "Qualitative."}], "anim": {"titre": "Réussir son étude de marché", "scenes": [{"t": "Tout part d'une question", "x": "Une étude répond à une question de décision. Vient ensuite le plan d'étude.", "v": "row", "items": ["Objectifs", "Informations", "Méthode", "Échantillon", "Calendrier", "Budget"]}, {"t": "Trois méthodes", "x": "On commence toujours par le documentaire. Le qualitatif aide à comprendre le pourquoi. Le quantitatif permet de mesurer.", "v": "row", "items": ["Documentaire", "Qualitative", "Quantitative"]}, {"t": "Combien de réponses ?", "x": "Il faut environ quatre cents réponses pour une marge d'erreur d'environ cinq pour cent sur une grande population.", "v": "big", "items": ["≈ 400 réponses → marge d'environ 5 %"]}, {"t": "Attention aux biais", "x": "Six biais peuvent fausser les résultats : échantillonnage, sélection, formulation, désirabilité sociale, confirmation et déclaratif.", "v": "grid", "items": ["Échantillonnage", "Sélection", "Formulation", "Désirabilité sociale"]}, {"t": "À retenir", "x": "Pas de bonne étude sans bonne question, pas de conclusion fiable sans connaître ses biais.", "v": "big", "items": ["Bonne question, biais connus"]}]}}, {"id": "em4", "subject": "Étude de marché et veille", "title": "Cours 4 : Analyser le marché et les comportements d'achat", "date": "2026-11-05", "body": "Journée 2, 45 min\n\n**À la fin de ce cours, vous saurez :**\n\n- segmenter un marché en BtoC et en BtoB\n- comprendre le processus de décision et le centre d'achat\n- repérer les tendances : digital, RSE, accessibilité\n\n## L'essentiel\n\nRésumé ajouté pour réviser, il ne vient pas des slides.\n\n- On segmente avec des critères BtoC ou BtoB, puis on garde les segments assez grands, rentables et accessibles.\n- Le client passe par 5 étapes, du besoin à l'après-achat.\n- En BtoB, plusieurs rôles pèsent sur la décision : c'est le centre d'achat.\n\n## Temps 1 : Segmenter\n\n**Segmenter le marché**\n\n**1. Critères BtoC**\n\n- Géographiques\n- Socio-démographiques\n- Psychographiques : valeurs, style de vie\n- Comportementaux : fréquence, fidélité, avantage recherché\n\n**2. Critères BtoB**\n\n- Secteur, taille, zone\n- Structure d'achat : centralisée ou non\n- Volume, critères de choix\n\n**3. Segments stratégiques**\n\n- Taille suffisante\n- Croissance\n- Rentabilité\n- Accessibilité pour l'entreprise\n\n## Temps 2 : Besoins et comportements d'achat\n\n**Comment les clients décident**\n\nReconnaissance du besoin → Recherche d'information → Évaluation des options → Achat → Après l'achat\n\n**En BtoB, le centre d'achat**\n\n| Rôle | Ce qu'il fait |\n| --- | --- |\n| **Utilisateur** | Se sert du produit |\n| **Prescripteur** | Recommande |\n| **Acheteur** | Négocie et commande |\n| **Décideur** | Tranche |\n| **Filtre** | Contrôle l'accès à l'information |\n\n## Temps 3 : Tendances et enjeux\n\n**Les tendances qui transforment les marchés**\n\n**1. Consommation**\n\n- Local, circuits courts\n- Santé, naturalité\n- Arbitrages de pouvoir d'achat\n- Seconde main, personnalisation\n\n**2. Digitalisation**\n\n- Recherche en ligne avant achat\n- Avis clients\n- Social commerce\n- Acheteurs BtoB plus autonomes\n\n**3. RSE**\n\n- Origine, emballages, éthique\n- Vigilance sur le greenwashing\n\n**4. Accessibilité**\n\n- Clients en situation de handicap, seniors\n- Sites et points de vente accessibles\n- Un besoin et un marché\n\n## Mots-clés\n\n- **Psychographique :** lié aux valeurs et au style de vie.\n- **Centre d'achat :** l'ensemble des personnes qui interviennent dans un achat BtoB.\n\n## Pour réviser\n\n- Quels sont les 4 types de critères de segmentation BtoC ?\n- Quels sont les 5 rôles du centre d'achat ?\n- Quelles tendances transforment les marchés ?", "fiches": [{"q": "Quels sont les 4 critères de segmentation BtoC ?", "a": "Géographiques, socio-démographiques, psychographiques, comportementaux."}, {"q": "Quels sont les critères de segmentation BtoB ?", "a": "Secteur, taille, zone, structure d'achat, volume, critères de choix."}, {"q": "Qu'est-ce qu'un segment stratégique ?", "a": "Un segment de taille suffisante, en croissance, rentable et accessible pour l'entreprise."}, {"q": "Quelles sont les 5 étapes de décision du client ?", "a": "Reconnaissance du besoin, recherche d'information, évaluation des options, achat, après l'achat."}, {"q": "Quel rôle joue chacun dans le centre d'achat ?", "a": "Utilisateur : se sert du produit. Prescripteur : recommande. Acheteur : négocie et commande. Décideur : tranche. Filtre : contrôle l'accès à l'information."}, {"q": "Quelles tendances transforment les marchés ?", "a": "Consommation, digitalisation, RSE et accessibilité."}, {"q": "Quelles évolutions de consommation sont citées ?", "a": "Local, circuits courts, santé, naturalité, arbitrages de pouvoir d'achat, seconde main, personnalisation."}, {"q": "Quels effets a la digitalisation ?", "a": "Recherche en ligne avant achat, avis clients, social commerce, acheteurs BtoB plus autonomes."}, {"q": "Exercice : segmenter selon le style de vie. Quel type de critère ?", "a": "Psychographique."}, {"q": "Exercice : la personne qui négocie et passe la commande. Quel rôle ?", "a": "L'acheteur."}], "anim": {"titre": "Comment les clients décident", "scenes": [{"t": "Segmenter", "x": "En BtoC, quatre familles de critères : géographiques, socio-démographiques, psychographiques et comportementaux.", "v": "row", "items": ["Géographiques", "Socio-démographiques", "Psychographiques", "Comportementaux"], "plain": true}, {"t": "Un bon segment", "x": "Il doit avoir une taille suffisante, de la croissance, de la rentabilité et être accessible pour l'entreprise.", "v": "row", "items": ["Taille", "Croissance", "Rentabilité", "Accessibilité"], "plain": true}, {"t": "Le processus de décision", "x": "Le client passe par cinq étapes, de la reconnaissance du besoin à l'après-achat.", "v": "row", "items": ["Besoin", "Information", "Évaluation", "Achat", "Après l'achat"]}, {"t": "Le centre d'achat", "x": "En BtoB, cinq rôles : l'utilisateur se sert du produit, le prescripteur recommande, l'acheteur négocie et commande, le décideur tranche, le filtre contrôle l'accès à l'information.", "v": "row", "items": ["Utilisateur", "Prescripteur", "Acheteur", "Décideur", "Filtre"], "on": 3, "plain": true}, {"t": "Les tendances", "x": "Quatre tendances transforment les marchés : consommation, digitalisation, RSE et accessibilité.", "v": "grid", "items": ["Consommation", "Digitalisation", "RSE", "Accessibilité"]}]}}, {"id": "em5", "subject": "Étude de marché et veille", "title": "Cours 5 : Analyser l'environnement concurrentiel", "date": "2026-11-05", "body": "Journée 3, 45 min\n\n**À la fin de ce cours, vous saurez :**\n\n- identifier concurrents directs, indirects et génériques\n- analyser un positionnement et les facteurs clés de succès\n- évaluer menaces concurrentielles et barrières à l'entrée\n\n## L'essentiel\n\nRésumé ajouté pour réviser, il ne vient pas des slides.\n\n- La concurrence se lit en 3 cercles : directe, indirecte et générique.\n- Un concurrent générique capte le même budget, même avec une offre très différente.\n- Le positionnement se visualise sur une carte perceptuelle, et Porter propose 3 stratégies pour se démarquer.\n- On analyse les concurrents, leurs menaces, les barrières à l'entrée et leur posture selon Kotler.\n\n## Temps 1 : Identifier les concurrents\n\n**Trois cercles de concurrence**\n\n| Cercle | Définition | Exemple Cyclonef |\n| --- | --- | --- |\n| **Directs** | Même produit, même cible | Autres loueurs de vélos pour entreprises |\n| **Indirects** | Produit différent, même besoin | Vélos en libre-service, trottinettes, covoiturage |\n| **Génériques** | Tout ce qui capte le même budget | Le budget « mobilité et avantages salariés » |\n\n## Temps 2 : Positionnement\n\n**Positionnement et avantage concurrentiel**\n\n**Le positionnement :** la place d'une offre dans l'esprit des clients, face aux concurrents. Outil : la carte perceptuelle sur 2 axes choisis par les clients.\n\n**Exemple de carte perceptuelle n- **Avantage concurrentiel :** ce qui permet à une entreprise de faire mieux que ses concurrents.\n- **Barrière à l'entrée :** ce qui rend difficile l'arrivée d'un nouveau concurrent.\n- **Facteur clé de succès :** ce qu'il faut maîtriser pour réussir sur un marché.\n\n## Pour réviser\n\n- Quelle différence entre concurrent direct et indirect ?\n- Donne un concurrent générique pour Cyclonef.\n- Quelles sont les 3 stratégies de Porter ?\n- Sur la carte, quel concurrent propose un prix élevé pour un service minimal ?\n- Quelle zone de la carte reste vide, et pourquoi faut-il s'en méfier ?\n- Quelles sont les 4 postures concurrentielles de Kotler ?\n- Cite trois barrières à l'entrée.", "fiches": [{"q": "Qu'est-ce qu'un concurrent direct ?", "a": "Même produit, même cible."}, {"q": "Qu'est-ce qu'un concurrent indirect ?", "a": "Produit différent, même besoin."}, {"q": "Qu'est-ce qu'un concurrent générique ?", "a": "Tout ce qui capte le même budget."}, {"q": "Pour Cyclonef, donne un exemple de chaque cercle.", "a": "Direct : autres loueurs de vélos pour entreprises. Indirect : vélos en libre-service, trottinettes, covoiturage. Générique : le budget « mobilité et avantages salariés »."}, {"q": "Qu'est-ce que le positionnement ?", "a": "La place d'une offre dans l'esprit des clients, face aux concurrents."}, {"q": "Qu'est-ce qu'une carte perceptuelle ?", "a": "L'outil du positionnement, sur 2 axes choisis par les clients."}, {"q": "Quelles sont les 3 stratégies de Porter ?", "a": "Domination par les coûts, différenciation, concentration sur une niche."}, {"q": "Qu'est-ce qu'un facteur clé de succès ?", "a": "Ce qu'il faut maîtriser pour réussir sur ce marché : personnalisation, délais, image locale…"}, {"q": "Que regarde-t-on pour analyser un concurrent ?", "a": "Cible, offre, prix, canaux, communication, forces et faiblesses."}, {"q": "Quelles menaces montrent les 5 forces de Porter ?", "a": "Rivalité, nouveaux entrants, substituts, pouvoir des clients et des fournisseurs."}, {"q": "Quelles sont les barrières à l'entrée ?", "a": "Investissements, réglementation, accès à la distribution, notoriété des marques en place, savoir-faire."}, {"q": "Quelles sont les 4 postures de Kotler ?", "a": "Leader, challenger, suiveur, spécialiste."}, {"q": "Que fait chaque posture de Kotler ?", "a": "Leader : domine le marché. Challenger : attaque le leader. Suiveur : imite et s'aligne. Spécialiste : domine une niche."}, {"q": "Exercice : un cinéma face à Netflix. Quel cercle de concurrence ?", "a": "Indirect : produit différent, même besoin."}, {"q": "Exercice : une entreprise qui attaque le n° 1 du marché. Quelle posture ?", "a": "Challenger."}, {"q": "Exercice : une entreprise qui domine un petit marché précis. Quelle posture ?", "a": "Spécialiste."}], "anim": {"titre": "Lire la concurrence", "scenes": [{"t": "Les concurrents directs", "x": "Même produit, même cible. Pour Cyclonef : les autres loueurs de vélos pour entreprises.", "v": "ring", "items": ["Génériques", "Indirects", "Directs"], "on": 2}, {"t": "Les concurrents indirects", "x": "Produit différent, même besoin. Pour Cyclonef : vélos en libre-service, trottinettes, covoiturage.", "v": "ring", "items": ["Génériques", "Indirects", "Directs"], "on": 1}, {"t": "Les concurrents génériques", "x": "Tout ce qui capte le même budget. Pour Cyclonef : le budget mobilité et avantages salariés.", "v": "ring", "items": ["Génériques", "Indirects", "Directs"], "on": 0}, {"t": "Les 3 stratégies de Porter", "x": "Domination par les coûts, différenciation, ou concentration sur une niche.", "v": "row", "items": ["Coûts", "Différenciation", "Niche"], "plain": true}, {"t": "Les postures de Kotler", "x": "Le leader domine le marché, le challenger attaque le leader, le suiveur imite et s'aligne, le spécialiste domine une niche.", "v": "grid", "items": ["Leader", "Challenger", "Suiveur", "Spécialiste"]}]}}];
let courses=SEED.map(c=>({...c}));

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>Array.from(String(s)).map(c=>{const n=c.normalize('NFD')[0].toLowerCase();return n.length===1?n:c}).join('');
const fmtDate=d=>{if(!d)return '';const x=new Date(d+'T12:00:00');return isNaN(x)?'':x.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})};
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');

function carte(line){
  const p=line.slice(2,-2).split('|').slice(1);
  if(p.length<5)return '<p>'+inline(line)+'</p>';
  const [xl,xh,yl,yh]=p,X=v=>320+v*2.7,Y=v=>220-v*1.8;
  const pts=p.slice(4).map(x=>{const a=x.split(':'),me=a[0].startsWith('*');return {n:a[0].replace(/^\*/,''),x:+a[1],y:+a[2],me}});
  const desc=pts.map(a=>a.n).join(', ');
  return `<figure class="carte"><svg viewBox="0 0 640 440" role="img" aria-label="${esc('Carte perceptuelle : '+xl+' à '+xh+', '+yl+' à '+yh+'. '+desc)}">
    <rect x="1" y="1" width="638" height="438" rx="14" class="c-bg"/>
    <rect x="320" y="24" width="296" height="196" class="c-zone"/>
    <line x1="24" y1="220" x2="616" y2="220" class="c-axis"/><line x1="320" y1="24" x2="320" y2="416" class="c-axis"/>
    <text x="28" y="246" class="c-lab">${esc(xl)}</text><text x="612" y="246" text-anchor="end" class="c-lab">${esc(xh)}</text>
    <text x="332" y="42" class="c-lab">${esc(yh)}</text><text x="332" y="412" class="c-lab">${esc(yl)}</text>
    ${pts.map(a=>`<circle cx="${X(a.x)}" cy="${Y(a.y)}" r="${a.me?13:10}" class="${a.me?'c-me':'c-pt'}"/><text x="${X(a.x)+(a.me?20:17)}" y="${Y(a.y)+7}" class="${a.me?'c-name me':'c-name'}">${esc(a.n)}</text>`).join('')}
  </svg></figure>`;
}
function md(src){
  const lines=src.split(/\r?\n/);let h='',i=0;
  while(i<lines.length){
    const l=lines[i].trim();
    if(!l){i++;continue}
    if(l.startsWith('[[carte|')&&l.endsWith(']]')){h+=carte(l);i++;continue}
    if(l.startsWith('### ')){h+='<h4>'+inline(l.slice(4))+'</h4>';i++;continue}
    if(l.startsWith('## ')){h+='<h3>'+inline(l.slice(3))+'</h3>';i++;continue}
    if(l.startsWith('# ')){h+='<h3>'+inline(l.slice(2))+'</h3>';i++;continue}
    if(/^[-*] /.test(l)){
      h+='<ul>';
      while(i<lines.length&&/^[-*] /.test(lines[i].trim())){h+='<li>'+inline(lines[i].trim().slice(2))+'</li>';i++}
      h+='</ul>';continue
    }
    if(l.startsWith('|')){
      const rows=[];
      while(i<lines.length&&lines[i].trim().startsWith('|')){rows.push(lines[i].trim());i++}
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      const hasHead=rows[1]&&/^[|\s:-]+$/.test(rows[1]);
      h+='<div class="tablewrap"><table>';
      if(hasHead)h+='<thead><tr>'+cells(rows[0]).map(c=>'<th scope="col">'+inline(c)+'</th>').join('')+'</tr></thead>';
      h+='<tbody>'+rows.slice(hasHead?2:0).map(r=>'<tr>'+cells(r).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      continue
    }
    h+='<p>'+inline(l)+'</p>';i++;
  }
  return h;
}

function highlight(root,q){
  if(!q)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const t=n.nodeValue,f=fold(t);let at=f.indexOf(q);
    if(at<0)return;
    const frag=document.createDocumentFragment();let last=0;
    while(at>=0){
      frag.append(t.slice(last,at));
      const m=document.createElement('mark');m.textContent=t.slice(at,at+q.length);frag.append(m);
      last=at+q.length;at=f.indexOf(q,last);
    }
    frag.append(t.slice(last));n.replaceWith(frag);
  });
}

function renderNav(){
  const shown=sorted().filter(matches),groups={};
  const all=[...new Set(sorted().map(c=>c.subject||'Sans matière'))];

  const nav=$('nav');
  if(!shown.length){nav.innerHTML='<p class="empty">Aucun cours ne contient ce mot. Essaie un autre mot.</p>';return}
  nav.innerHTML=all.filter(s=>groups[s]).map(s=>{
    const n=groups[s].length,open=query||!closed.includes(s)||groups[s].some(c=>c.id===current);

function sceneVisual(sc){

  return `<div class="vrow${sc.plain?' plain':''}">${it.map((x,i)=>`<div class="${cl(i)}" ${d(i)}>${esc(x)}</div>`).join('')}</div>`;

function mountAnim(a){
  const el=$('anim'),sp=window.speechSynthesis,hasVoice=!!(sp&&window.SpeechSynthesisUtterance);
  let i=0,playing=false,voice=hasVoice,timer=null,tok=0;
  const halt=()=>{tok++;clearTimeout(timer);try{if(sp)sp.cancel()}catch(e){}};
  animStop=halt;
  function draw(focus){
    const sc=a.scenes[i];
    el.innerHTML=`<div class="animhead"><strong>Explication animée</strong><span>${esc(a.titre)}</span></div>
      <div class="stage"><div class="scene"><h4>${esc(sc.t)}</h4>${sceneVisual(sc)}<p>${esc(sc.x)}</p></div></div>
      <div class="animbar"><i style="width:${Math.round((i+1)/a.scenes.length*100)}%"></i></div>
      <div class="animctl"><button class="ghost" id="aPrev"${i?'':' disabled'}>Précédent</button><button class="primary" id="aPlay">${playing?'Pause':(i===a.scenes.length-1&&!playing?'Relancer':'Lancer')}</button><button class="ghost" id="aNext"${i<a.scenes.length-1?'':' disabled'}>Suivant</button>${hasVoice?`<button class="ghost" id="aVoice" aria-pressed="${voice}">${voice?'Voix activée':'Voix coupée'}</button>`:''}<span class="animstep">Étape ${i+1} sur ${a.scenes.length}</span></div>`;
    $('aPrev').onclick=()=>{halt();i=Math.max(0,i-1);draw('aPrev');if(playing)say()};
    $('aNext').onclick=()=>{halt();i=Math.min(a.scenes.length-1,i+1);draw('aNext');if(playing)say()};
    $('aPlay').onclick=()=>{if(playing){playing=false;halt();draw('aPlay');return}
      if(i===a.scenes.length-1)i=0;playing=true;draw('aPlay');say()};
    if($('aVoice'))$('aVoice').onclick=()=>{voice=!voice;halt();draw('aVoice');if(playing)say()};
    if(focus&&$(focus)&&!$(focus).disabled)$(focus).focus({preventScroll:true});
  }
  function next(t){
    if(t!==tok||!playing)return;
    if(i<a.scenes.length-1){i++;draw();say()}else{playing=false;draw()}
  }
  function say(){
    const sc=a.scenes[i],t=++tok,txt=sc.t+'. '+sc.x;
    clearTimeout(timer);
    if(voice&&hasVoice){
      try{
        sp.cancel();
        const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=1;
        u.onend=()=>next(t);
        sp.speak(u);
        timer=setTimeout(()=>next(t),txt.length*110+3000);
        return;
      }catch(e){}
    }
    timer=setTimeout(()=>next(t),Math.max(4000,txt.length*65));
  }
  draw();
}

const store={
  async read(){
    if(window.storage){const r=await window.storage.get(KEY,false);return r&&r.value}
    return window.localStorage.getItem(KEY);
  },
  async write(v){
    if(window.storage){const r=await window.storage.set(KEY,v,false);if(!r)throw new Error('fail');return}
    window.localStorage.setItem(KEY,v);
  }
};
async function persist(ok){
  try{await store.write(JSON.stringify(courses));$('status').textContent=ok}
  catch(e){$('status').textContent="Ce cours n'est pas sauvegardé sur cet appareil. Exporte tes cours pour les garder."}
}
function valid(d){return Array.isArray(d)&&d.every(c=>c&&typeof c.id==='string'&&typeof c.title==='string'&&typeof c.body==='string')}
// Récupère cours.json sur le site et ajoute les nouveautés.
async function sync(){
  let remote;
  try{
    const r=await fetch('cours.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    remote=await r.json();
    if(!valid(remote))return;
  }catch(e){return}
  let changed=0;
  remote.forEach(n=>{
    const i=courses.findIndex(c=>c.id===n.id);
    if(i<0){courses.push(n);changed++;return}
    const l=courses[i];
    if(l.deleted)return;
    if(l.edited){if(!l.fiches&&n.fiches){l.fiches=n.fiches;changed++}if(!l.anim&&n.anim){l.anim=n.anim;changed++}return}
    if(l.title!==n.title||l.body!==n.body||l.subject!==n.subject||l.date!==n.date||JSON.stringify(l.fiches)!==JSON.stringify(n.fiches)||JSON.stringify(l.anim)!==JSON.stringify(n.anim)){courses[i]=n;changed++}
  });
  if(changed){await persist('Cours mis à jour.');if(!editing)render()}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
async function load(){
  try{
    const v=await store.read();
    if(v){const d=JSON.parse(v);if(valid(d))courses=d}
  }catch(e){/* première ouverture : on garde les cours de départ */}
  const c5=courses.find(c=>c.id==='c5'&&!c.deleted&&!c.edited);
  if(c5){
    let changed=false;
    if(!c5.body.includes('Du multicanal')){c5.body=c5.body.trimEnd()+'\n\n'+CANAUX;changed=true}
    if(!c5.body.includes('Choisir ses canaux')){c5.body=c5.body.trimEnd()+'\n\n'+TEMPS3;changed=true}
    if(changed)await persist('');
  }
  let added=false;
  SEED.forEach(n=>{const l=courses.find(c=>c.id===n.id);if(!l){courses.push({...n});added=true}else if(!l.deleted){if(!l.fiches&&n.fiches){l.fiches=n.fiches;added=true}if(!l.anim&&n.anim){l.anim=n.anim;added=true}}});
  if(added)await persist('');
  await sync();
  const list=sorted();
  
  render();
}

// Import PDF : le texte est lu sur l'appareil, sans IA.
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return new Promise((ok,ko)=>{
    const t=document.createElement('script');t.src=PDFJS+'pdf.min.js';
    t.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';ok(window.pdfjsLib)};
    t.onerror=()=>ko(new Error('script'));document.head.append(t);
  });
}
function pageLines(items){
  const rows=new Map();
  items.filter(i=>i.str&&i.str.trim()).forEach(i=>{
    const y=Math.round(i.transform[5]/3)*3;
    if(!rows.has(y))rows.set(y,[]);
    rows.get(y).push(i);
  });
  return [...rows.keys()].sort((a,b)=>b-a).map(y=>{
    let line='',end=null;
    rows.get(y).sort((a,b)=>a.transform[4]-b.transform[4]).forEach(i=>{
      if(end!==null&&i.transform[4]-end>1&&!line.endsWith(' '))line+=' ';
      line+=i.str;end=i.transform[4]+(i.width||0);
    });
    return line.replace(/\s+/g,' ').trim();
  }).filter(Boolean);
}
function cleanPdf(pages){
  const seen={};
  pages.forEach(p=>new Set(p).forEach(l=>seen[l]=(seen[l]||0)+1));
  const repeated=l=>pages.length>=3&&seen[l]>=pages.length/2;
  return pages.map(p=>p.filter(l=>!repeated(l)).map(l=>l
    .replace(/(?:^|(?<=\s))(?:\p{L} ){2,}\p{L}(?=\s|$)/gu,m=>m.replace(/ /g,''))
    .replace(/^[•●▪◦‣·]\s*/,'- ')).join('\n')).filter(Boolean).join('\n\n');
}
$('pdfBtn').onclick=()=>{setMenu(false);$('pdfFile').click()};
$('pdfFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>30*1024*1024){$('status').textContent='Ce PDF dépasse 30 Mo. Choisis un fichier plus léger.';return}
  $('status').textContent='Lecture du PDF…';
  try{
    const lib=await loadPdfJs();
    const pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise;
    const pages=[];
    for(let n=1;n<=pdf.numPages;n++){
      const c=await (await pdf.getPage(n)).getTextContent();
      pages.push(pageLines(c.items));
    }
    const body=cleanPdf(pages);
    if(body.replace(/\s/g,'').length<20){$('status').textContent="Ce PDF ne contient pas de texte à copier, c'est sûrement un scan. Ajoute ce cours à la main.";return}
    editing={id:'',title:f.name.replace(/\.pdf$/i,''),subject:SUBJECT,date:new Date().toISOString().slice(0,10),body};
    render();window.scrollTo(0,0);
    $('status').textContent='PDF lu. Vérifie le texte, puis enregistre le cours.';
  }catch(err){
    $('status').textContent=err.message==='script'?"Impossible de lire les PDF sans connexion. Vérifie internet et réessaie.":"Ce PDF ne peut pas être lu. Il est peut-être protégé par un mot de passe.";
  }
};
